<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Repair Price Matrix</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F9FA;
    --bg-grad:#F8F9FA;
    --panel:#FFFFFF;
    --panel2:#F1F3F4;
    --panel-solid:#FFFFFF;
    --border:#DADCE0;
    --border-soft:#E8EAED;
    --text:#202124;
    --text-dim:#3C4043;
    --text-faint:#5F6368;
    --teal:#0B57D0;
    --teal-dim:#0B57D0;
    --blue:#0B57D0;
    --good:#137333;
    --good-bg:#E6F4EA;
    --mid:#B06000;
    --mid-bg:#FEF7E0;
    --bad:#C5221F;
    --bad-bg:#FCE8E6;
    --red:#C5221F;
    --radius:10px;
    --glass-blur:0px;
    --shadow:0 3px 12px rgba(60,64,67,0.15);
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--text);font-family:var(--font-body);height:100%;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--bg-grad);background-attachment:fixed;transition:background .3s;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;position:relative;}

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:16px;
    padding:12px 20px;background:var(--panel);
    backdrop-filter:blur(var(--glass-blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;position:relative;z-index:10;
  }
  .brand-mark{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand-mark .dot{width:10px;height:10px;border-radius:3px;background:var(--teal);box-shadow:0 0 12px var(--teal);}
  .brand-mark .name{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:0.02em;}
  .brand-mark .sub{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.12em;margin-top:1px;}

  #searchwrap{position:relative;flex:1;max-width:480px;}
  #search{
    width:100%;padding:9px 14px 9px 36px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13.5px;font-family:var(--font-body);
    outline:none;transition:border-color .15s, background .15s;
  }
  #search:focus{border-color:var(--teal);background:#FFFFFF;box-shadow:0 1px 2px rgba(60,64,67,.12);}
  #searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-faint);pointer-events:none;}
  #searchresults{
    position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:65vh;overflow-y:auto;
    background:#FFFFFF !important;
    border:1px solid var(--border);border-radius:12px;
    box-shadow:0 8px 24px rgba(60,64,67,.20);display:none;z-index:99999;
  }
  #searchresults.show{display:block;}
  .sr-item{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;border-bottom:1px solid var(--border-soft);background:#FFFFFF !important;transition:background .12s;}
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:#F1F3F4 !important;}
  .sr-left{min-width:0;}
  .sr-model{font-size:13.5px;font-weight:700;display:block;color:var(--text);}
  .sr-brand{font-size:10px;color:var(--teal-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;background:rgba(43,217,201,.12);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:3px;}
  .sr-prices{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;}
  .sr-price-tag{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:#E8F0FE;border:1px solid var(--border);padding:3px 7px;border-radius:6px;white-space:nowrap;}
  .sr-price-main{font-family:var(--font-mono);font-size:17px;font-weight:700;color:var(--teal);background:#E0F7FA;padding:5px 11px;border-radius:8px;white-space:nowrap;}
  .sr-empty{padding:18px;font-size:13px;color:var(--text-faint);text-align:center;background:#FFFFFF !important;}

  #modetoggle{display:none;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px;flex-shrink:0;}
  #modetoggle.show{display:flex;}
  #modetoggle button{
    border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-weight:600;
    font-size:12.5px;padding:7px 14px;border-radius:6px;cursor:pointer;transition:all .15s;
  }
  #modetoggle button.active{background:var(--teal);color:#FFFFFF;}

  #adminbtn{
    flex-shrink:0;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);
    width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  #adminbtn:hover{border-color:var(--teal);color:var(--teal);}
  #adminbtn.unlocked{background:rgba(43,217,201,.12);border-color:var(--teal-dim);color:var(--teal);}
  #adminbtn svg{width:15px;height:15px;}

  #exportbtn{
    flex-shrink:0;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;
    font-family:var(--font-body);font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px;
    transition:filter .15s;
  }
  #exportbtn:hover{filter:brightness(1.12);}
  #exportbtn svg{width:14px;height:14px;}

  #savestate{font-size:10.5px;color:var(--text-faint);flex-shrink:0;font-family:var(--font-mono);min-width:80px;text-align:right;display:none;}
  #savestate.show{display:block;}
  #savestate.live::before{content:'● ';color:var(--good);}
  #savestate.saving::before{content:'● ';color:var(--mid);}

  /* ---------- Body layout ---------- */
  #body{flex:1;display:flex;overflow:hidden;position:relative;}

  #rail{
    width:190px;flex-shrink:0;background:var(--panel);
    backdrop-filter:blur(var(--glass-blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    border-right:1px solid var(--border-soft);
    overflow-y:auto;padding:12px 8px;
  }
  .rail-btn{
    width:100%;text-align:left;background:transparent;border:none;color:var(--text-dim);
    padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:500;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;transition:all .12s;
  }
  .rail-btn:hover{background:var(--panel2);color:var(--text);}
  .rail-btn.active{background:linear-gradient(90deg,rgba(43,217,201,.16),rgba(43,217,201,.03));color:var(--teal);font-weight:700;}
  .rail-btn .count{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
  .rail-btn.active .count{color:var(--teal-dim);}

  #main{flex:1;overflow:auto;padding:20px 24px 60px;overscroll-behavior:contain;scrollbar-gutter:stable;}
  /* Editing tables own their scroll area, so the horizontal bar is always usable. */
  #main:has(> .table-scroll){overflow:hidden;display:flex;flex-direction:column;padding-bottom:20px;}
  .table-scroll{border-radius:10px;border:1px solid var(--border-soft);background:var(--panel);contain:layout paint;overflow:auto;flex:1;min-height:0;scrollbar-gutter:stable;}
  .table-scroll > table{width:max-content;min-width:100%;}


  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .toolbar h2{font-family:var(--font-display);font-size:18px;margin:0;}
  .toolbar .hint{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .btn-add{
    background:var(--teal);color:#FFFFFF;border:none;border-radius:8px;padding:9px 15px;font-weight:700;
    font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:filter .15s;
  }
  .btn-add:hover{filter:brightness(1.1);}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  thead th{
    position:sticky;top:0;background:var(--panel-solid);color:var(--text-faint);text-align:right;
    font-family:var(--font-body);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    padding:9px 10px;white-space:nowrap;z-index:3;box-shadow:inset 0 -1px 0 var(--border);
  }
  thead th:first-child{text-align:left;position:sticky;left:0;z-index:4;}
  tbody td{padding:6px 10px;border-bottom:1px solid var(--border-soft);text-align:right;white-space:nowrap;background:transparent;}
  tbody td:first-child{text-align:left;font-weight:600;color:var(--text);white-space:normal;position:sticky;left:0;background:var(--panel-solid);z-index:1;}
  tbody tr:hover td{background:rgba(128,160,220,0.06);}
  tbody tr:hover td:first-child{background:var(--panel-solid);}
  .section-row{background:var(--panel2) !important;color:var(--teal);font-family:var(--font-display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:10px !important;position:sticky;left:0;}
  tbody tr.flash td{animation:flash 1.4s ease;}
  @keyframes flash{0%{background:rgba(43,217,201,.28) !important;}100%{background:transparent;}}

  .cell-name input{
    width:100%;min-width:140px;background:transparent;border:1px solid transparent;border-radius:6px;
    color:var(--text);font-family:var(--font-body);font-weight:600;font-size:13px;padding:5px 7px;
  }
  .cell-name input:hover{border-color:var(--border);}
  .cell-name input:focus{outline:none;border-color:var(--teal);background:var(--panel2);}

  .cell-cost input, .cell-price input{
    width:64px;text-align:right;border-radius:6px;font-family:var(--font-mono);font-size:12.5px;padding:5px 6px;border:1px solid;
  }
  .cell-cost input{
    background:rgba(248,113,113,0.07);border-color:rgba(248,113,113,0.32);color:#F5A3A3;
  }
  .cell-price input{
    background:rgba(52,211,153,0.08);border-color:rgba(52,211,153,0.32);color:#7FE8C4;
  }
  .cell-cost input:focus{outline:none;border-color:var(--red);background:rgba(248,113,113,0.14);}
  .cell-price input:focus{outline:none;border-color:var(--good);background:rgba(52,211,153,0.14);}
  .col-legend{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--text-faint);margin-bottom:10px;}
  .col-legend span{display:inline-flex;align-items:center;gap:6px;}
  .col-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .sw-cost{background:rgba(248,113,113,0.5);border:1px solid var(--red);}
  .sw-price{background:rgba(52,211,153,0.5);border:1px solid var(--good);}
  .euro-prefix{color:var(--text-faint);font-family:var(--font-mono);font-size:11.5px;margin-right:3px;}

  .profit-chip{
    display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-weight:600;font-size:11.5px;
    padding:4px 8px;border-radius:999px;white-space:nowrap;
  }
  .profit-good{background:var(--good-bg);color:var(--good);}
  .profit-mid{background:var(--mid-bg);color:var(--mid);}
  .profit-bad{background:var(--bad-bg);color:var(--bad);}
  .profit-na{color:var(--text-faint);font-family:var(--font-mono);font-size:12px;}

  .price-plain{font-family:var(--font-mono);color:var(--text);}
  .price-empty{color:var(--text-faint);}

  .cell-del{width:76px;padding:0 4px 0 0 !important;white-space:nowrap;}
  .cell-del .del-btn{margin-left:3px;}
  .del-btn{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text-faint);cursor:pointer;font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .del-btn:hover{background:rgba(248,113,113,.15);border-color:var(--red);color:var(--red);}
  .del-btn[data-moverow]:hover{background:rgba(43,217,201,.15);border-color:var(--teal);color:var(--teal);}

  /* ---------- Customer view ---------- */
  body.customer-mode #main{background:transparent;}
  .cv-card{
    background:#FFFFFF;color:var(--text);border-radius:14px;overflow:hidden;margin-bottom:26px;
    box-shadow:var(--shadow);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid rgba(255,255,255,0.4);
  }
  .cv-head{
    background:#FFFFFF;color:var(--text);padding:18px 24px;border-bottom:1px solid var(--border-soft);
    display:flex;justify-content:space-between;align-items:center;
  }
  .cv-head .cv-title{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.01em;}
  .cv-head .cv-sub{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-top:3px;}
  .cv-badge{background:#E8F0FE;color:var(--teal);font-weight:700;font-size:10.5px;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;}

  .cv-table-scroll{overflow:auto;max-height:calc(100dvh - 220px);scrollbar-gutter:stable;}
  .cv-table-scroll table{width:max-content;min-width:100%;font-size:12.5px;}
  .cv-card thead th{position:sticky;top:0;z-index:3;background:#F8F9FA;color:var(--text-faint);box-shadow:inset 0 -1px 0 var(--border);}
  .cv-card thead th:first-child{left:0;z-index:6;min-width:180px;text-align:left;box-shadow:2px 0 4px rgba(60,64,67,.12),inset 0 -1px 0 var(--border);}
  .cv-card tbody td{border-bottom:1px solid var(--border-soft);color:var(--text);background:transparent;}
  .cv-card tbody td:first-child{position:sticky;left:0;z-index:2;min-width:180px;padding:6px 10px;text-align:left;font-weight:600;background:#FFFFFF;box-shadow:2px 0 4px rgba(60,64,67,.10);}
  .cv-card tbody tr:nth-child(even) td{background:#F8F9FA;}
  .cv-card tbody tr:nth-child(even) td:first-child{background:#F8F9FA;}
  .cv-card tbody tr:hover td{background:#F1F3F4;}
  .cv-card tbody tr:hover td:first-child{background:#F1F3F4;}
  .cv-card .price-plain{color:var(--text);font-weight:600;}
  .cv-sectiontitle td{background:#E8F0FE !important;color:var(--teal);font-family:var(--font-display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px;}

  .cv-footer{padding:14px 24px;background:#F8F9FA;color:var(--text-faint);font-size:10.5px;display:flex;justify-content:space-between;font-family:var(--font-mono);}

  .locked-banner{
    display:none;background:var(--panel2);border:1px dashed var(--border);border-radius:10px;
    padding:10px 16px;font-size:12px;color:var(--text-faint);margin-bottom:16px;
  }

  /* ---------- Pinned search result (persistent highlight) ---------- */
  tr.tr-pinned td{background:rgba(52,211,153,0.16) !important;}
  tr.tr-pinned td:first-child{box-shadow:inset 4px 0 0 var(--good);}
  .cv-card tr.tr-pinned td{background:rgba(52,211,153,0.22) !important;}

  /* ---------- Modal ---------- */
  #modal-overlay{
    position:fixed;inset:0;background:rgba(60,64,67,0.28);display:none;align-items:center;justify-content:center;
    z-index:200;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  #modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--panel2);backdrop-filter:blur(var(--glass-blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    border:1px solid var(--border);border-radius:14px;padding:24px;
    width:340px;max-width:calc(100vw - 40px);box-shadow:var(--shadow);
  }
  .modal-title{font-family:var(--font-display);font-weight:700;font-size:16px;margin-bottom:6px;}
  .modal-message{font-size:12.5px;color:var(--text-dim);margin-bottom:14px;line-height:1.5;}
  .modal-input{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);font-family:var(--font-mono);font-size:14px;outline:none;margin-bottom:8px;display:none;
  }
  .modal-input:focus{border-color:var(--teal);}
  .modal-error{color:var(--red);font-size:11.5px;min-height:16px;margin-bottom:6px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .modal-btn-cancel, .modal-btn-confirm{
    border:none;border-radius:8px;padding:9px 16px;font-family:var(--font-body);font-weight:600;font-size:12.5px;cursor:pointer;
  }
  .modal-btn-cancel{background:var(--panel2);color:var(--text-dim);border:1px solid var(--border);}
  .modal-btn-cancel:hover{color:var(--text);}
  .modal-btn-confirm{background:var(--teal);color:#FFFFFF;}
  .modal-btn-confirm:hover{filter:brightness(1.1);}
  .modal-btn-confirm.danger{background:var(--red);color:#2A0A0A;}

  /* ---------- Print ---------- */
  @media print{
    #topbar, #rail, #searchresults{display:none !important;}
    #body{overflow:visible !important;}
    #main{overflow:visible !important;padding:0 !important;}
    html,body{background:#fff !important;height:auto;}
    .cv-card{box-shadow:none;break-inside:avoid;margin-bottom:16px;border:1px solid #ccc;}
    .no-print{display:none !important;}
  }

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#BDC1C6;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 820px){
    #rail{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:40;box-shadow:20px 0 40px rgba(0,0,0,.4);}
    #rail.open{transform:translateX(0);}
    #railtoggle{display:flex !important;}
    #topbar{flex-wrap:wrap;gap:10px;row-gap:8px;}
    #searchwrap{order:3;max-width:100%;flex:1 1 100%;}
    #savestate{white-space:nowrap;}
    table{font-size:12px;}
  }
  #railtoggle{display:none;background:var(--panel2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

  /* Drag and drop styles */
  .draggable-row {
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .drag-handle {
    cursor: grab;
    user-select: none;
    text-align: center !important;
    display: inline-block;
    padding: 3px 6px;
    border-radius: 4px;
    color: var(--teal);
    font-weight: bold;
    font-size: 15px;
    touch-action: none;
  }
  .drag-handle:hover {
    background: rgba(43,217,201,0.18);
  }
  .drag-handle:active {
    cursor: grabbing;
  }
  .draggable-row.dragging {
    opacity: 0.35;
    background: rgba(43, 217, 201, 0.08) !important;
  }
  .draggable-row.drag-over td {
    border-top: 2px solid var(--teal) !important;
    background: rgba(43, 217, 201, 0.14) !important;
  }

  /* Checkbox and tick styles */
  .cell-tick {
    width: 50px;
    text-align: center !important;
  }
  .cell-tick input[type="checkbox"] {
    width: 15px;
    height: 15px;
    cursor: pointer;
    accent-color: var(--teal);
    vertical-align: middle;
  }
  .cell-time {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    text-align: center;
  }
  .cv-card .cell-time {
    text-align: right;
    padding-right: 15px;
  }
</style>
</head>
<body><div style="text-align:center;padding:7px 12px;background:#e2e9ee;color:#1c3446;font:14px system-ui">Sample repair matrix · Illustrative prices and costs · Changes stay on this device</div>
<div id="app">
  <div id="topbar">
    <button id="railtoggle">☰</button>
    <div class="brand-mark">

      <svg class="repair-logo-svg" viewBox="0 0 100 80" style="width:32px;height:32px;display:none;" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 22 25 C 38 12, 60 28, 64 45 C 50 38, 32 25, 22 25 Z" fill="#F1C40F"/>
        <path d="M 12 45 C 32 36, 56 55, 49 76 C 41 52, 22 43, 12 45 Z" fill="#F1C40F"/>
        <path d="M 78 25 C 62 12, 40 28, 36 45 C 50 38, 68 25, 78 25 Z" fill="#E74C3C"/>
        <path d="M 88 45 C 68 36, 44 55, 51 76 C 59 52, 78 43, 88 45 Z" fill="#E74C3C"/>
      </svg>
      <div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="name">My Business</span>
          <span style="font-size:9.5px;font-family:var(--font-mono);background:rgba(43,217,201,0.18);color:var(--teal);padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:0.04em;">v2.4.0</span>
        </div>
        <div class="sub">Repair Prices</div>
      </div>

function showModal({title, message='', showInput=false, inputType='text', placeholder='', confirmText='OK', cancelText='Cancel', danger=false}){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modal-overlay');
    const input = document.getElementById('modal-input');
    const err = document.getElementById('modal-error');
    const confirmBtn = document.getElementById('modal-confirm');
    const cancelBtn = document.getElementById('modal-cancel');

    document.getElementById('modal-title').textContent = title;
    const msgEl = document.getElementById('modal-message');
    msgEl.textContent = message;
    msgEl.style.display = message ? 'block' : 'none';
    input.style.display = showInput ? 'block' : 'none';
    input.type = inputType;
    input.placeholder = placeholder;
    input.value = '';
    err.textContent = '';
    confirmBtn.textContent = confirmText;
    confirmBtn.className = 'modal-btn-confirm' + (danger ? ' danger' : '');
    cancelBtn.textContent = cancelText;
    overlay.classList.add('show');
    if(showInput) setTimeout(()=>input.focus(), 60);

    function cleanup(){
      overlay.classList.remove('show');
      confirmBtn.onclick = null; cancelBtn.onclick = null; input.onkeydown = null; overlay.onclick = null;
    }
    confirmBtn.onclick = ()=>{ cleanup(); resolve(showInput ? input.value : true); };
    cancelBtn.onclick = ()=>{ cleanup(); resolve(showInput ? null : false); };
    input.onkeydown = (e)=>{ if(e.key==='Enter') confirmBtn.click(); if(e.key==='Escape') cancelBtn.click(); };
    overlay.onclick = (e)=>{ if(e.target===overlay) cancelBtn.click(); };
  });
}

function calcProfit(price, cost){
  if(price===null || price===undefined || price===0) return null;
  if(cost===null || cost===undefined) return null;
  const p = getBuyerProfitSettings();
  const net = p.pricesIncludeTax ? Number(price) / (1 + p.taxRate/100) : Number(price);
  return Math.round((net - Number(cost) - p.overhead)*100)/100;
}
function profitClass(p){
  if(p===null) return 'profit-na';
  if(p>=30) return 'profit-good';
  if(p>=15) return 'profit-mid';
  return 'profit-bad';
}
function fmtEuro(v){
  if(v===null || v===undefined || v===0) return null;
  return '€' + Number(v).toFixed(v%1===0?0:2);
}
function renderProfitChip(p, price, cost){
  if(p===null) return `<span class="profit-na">—</span>`;
  const cls = profitClass(p);
  const arrow = p>=30 ? '▲' : (p>=15 ? '●' : '▼');
  const tip = (price !== undefined && cost !== undefined) ? `title="Profit: €${p.toFixed(2)} (Price €${price} - ${getBuyerProfitSettings().pricesIncludeTax ? "inclusive" : "exclusive"} tax ${getBuyerProfitSettings().taxRate}% - Cost €${cost} - €${getBuyerProfitSettings().overhead} Overhead)"` : `title="Profit: €${p.toFixed(2)}"`;
  return `<span class="profit-chip ${cls}" ${tip}>${arrow} €${p.toFixed(2)}</span>`;
}

// ==================== DATA CLEANING ====================
function cleanBuiltinData(data) {
  if (!data || !data.brands) return data;

  // 0. Rename all "IP X" and "IPHONE X" model names to "iPhone X" in iPhone brand
  if (data.brands.iPhone && data.brands.iPhone.rows) {
    data.brands.iPhone.rows.forEach(row => {
      if (/^(IP|IPHONE)\s/i.test(row.model)) {
        row.model = 'iPhone ' + row.model.replace(/^(IP|IPHONE)\s/i, '');
      }
    });
  }

  // 1. Clean Xiaomi duplicates
  if (data.brands.Xiaomi && data.brands.Xiaomi.rows) {
    const seen = new Set();
    data.brands.Xiaomi.rows = data.brands.Xiaomi.rows.filter(row => {
      const key = row.model.trim().toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  // 2. Clean Google duplicates
  if (data.brands.Google && data.brands.Google.rows) {
    const seen = new Set();
    data.brands.Google.rows = data.brands.Google.rows.filter(row => {
      const key = row.model.trim().toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  // 3. Clean iPhone duplicates (keep the entry with most non-null fields)
  if (data.brands.iPhone && data.brands.iPhone.rows) {
    const seen = new Map();
    data.brands.iPhone.rows.forEach(row => {
      const key = row.model.trim().toLowerCase();
      if (!seen.has(key)) {
        seen.set(key, row);
      } else {
        const existing = seen.get(key);
        const existingFields = Object.values(existing).filter(v => v !== null).length;
        const newFields = Object.values(row).filter(v => v !== null).length;
        if (newFields > existingFields) seen.set(key, row);
      }
    });
    data.brands.iPhone.rows = Array.from(seen.values());
  }

  // 4. Fix Oppo casing & remove duplicates
  if (data.brands.Oppo && data.brands.Oppo.rows) {
    data.brands.Oppo.rows.forEach(row => {
      if (row.model.toLowerCase().startsWith('oppo ')) {
        row.model = 'Oppo ' + row.model.slice(5);
      }
    });
    const seen = new Set();
    data.brands.Oppo.rows = data.brands.Oppo.rows.filter(row => {
      const key = row.model.trim().toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  return data;
}

// ==================== CROSS-WINDOW SYNC & VERSION VALIDATION ====================
function shouldAcceptSync(incoming) {
  if (!incoming || !incoming.brands) return false;
  const incomingTime = incoming.updatedAt || 0;
  const localTime = (DB && DB.updatedAt) || 0;
  // Only accept sync if incoming data has a strictly NEWER timestamp than local state
  return incomingTime > localTime;
}

// 1. BroadcastChannel: instant sync between tabs/windows on same browser
const _bc = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('repair_classic_repair_sync') : null;
if (_bc) {
  _bc.onmessage = (ev) => {
    if (!ev.data || ev.data.key !== DATA_KEY) return;
    if (ev.data.senderId === _clientId) return; // Ignore self-broadcasts
    try {
      const parsed = JSON.parse(ev.data.value);
      if (!shouldAcceptSync(parsed)) return;
      if (state.mode === 'edit') {
        showSyncBanner(parsed);
      } else {
        DB = cleanBuiltinData(parsed);
        ALL_ITEMS = flattenAll();
        renderRail();
        renderMain();
      }
    } catch(e) {}
  };
}

// 2. localStorage 'storage' event: instant sync between tabs on same browser (fallback)
window.addEventListener('storage', (e) => {
  if (e.key !== DATA_KEY || !e.newValue) return;
  try {
    const parsed = JSON.parse(e.newValue);
    if (!shouldAcceptSync(parsed)) return;
    if (state.mode === 'edit') {
      showSyncBanner(parsed);
    } else {
      DB = cleanBuiltinData(parsed);
      ALL_ITEMS = flattenAll();
      renderRail();
      renderMain();
    }
  } catch(e) {}
});

// ==================== DRAG & DROP & TOUCH HANDLERS ====================
let dragSrcIdx = null;

function handleDragStart(e) {
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  const row = handle.closest('tr[data-row]');
  if (!row) return;

  dragSrcIdx = parseInt(row.dataset.row, 10);
  row.classList.add('dragging');

  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragSrcIdx));

  if (e.dataTransfer.setDragImage) {
    try { e.dataTransfer.setDragImage(row, 20, 20); } catch(err){}
  }
}

function handleDragOver(e) {
  if (e.preventDefault) e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.target.closest('tr[data-row]');
  if (row && row.dataset.row !== String(dragSrcIdx)) {
    document.querySelectorAll('tr.drag-over').forEach(r => {
      if (r !== row) r.classList.remove('drag-over');
    });
    row.classList.add('drag-over');
  }
  return false;
}

function handleDragLeave(e) {
  // Prevent dragleave flickering when hovering over nested table cells
}

function handleDrop(e) {
  if (e.preventDefault) e.preventDefault();
  if (e.stopPropagation) e.stopPropagation();

  const row = e.target.closest('tr[data-row]');
  document.querySelectorAll('tr.dragging, tr.drag-over').forEach(r => {
    r.classList.remove('dragging');
    r.classList.remove('drag-over');
  });

  if (!row || dragSrcIdx === null) return false;

  const destIdx = parseInt(row.dataset.row, 10);
  if (dragSrcIdx !== destIdx && !isNaN(destIdx)) {
    reorderRows(state.brand, dragSrcIdx, destIdx);
  }
  dragSrcIdx = null;
  return false;
}

function handleDragEnd(e) {
  document.querySelectorAll('tr.dragging, tr.drag-over').forEach(r => {
    r.classList.remove('dragging');
    r.classList.remove('drag-over');
  });
  dragSrcIdx = null;
}

// Touch Drag Support for Tablets and Phones
let touchStartRowIdx = null;

function handleTouchStart(e) {
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  const row = handle.closest('tr[data-row]');
  if (!row) return;
  touchStartRowIdx = parseInt(row.dataset.row, 10);
  row.classList.add('dragging');
}

function handleTouchMove(e) {
  if (touchStartRowIdx === null) return;
  const touch = e.touches[0];
  const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
  if (!targetEl) return;
  const row = targetEl.closest('tr[data-row]');
  if (row) {
    document.querySelectorAll('tr.drag-over').forEach(r => {
      if (r !== row) r.classList.remove('drag-over');
    });
    row.classList.add('drag-over');
  }
  if (e.cancelable) e.preventDefault();
}

function handleTouchEnd(e) {
  if (touchStartRowIdx === null) return;
  const touch = e.changedTouches[0];
  const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll('tr.dragging, tr.drag-over').forEach(r => {
    r.classList.remove('dragging');
    r.classList.remove('drag-over');
  });
  if (targetEl) {
    const row = targetEl.closest('tr[data-row]');
    if (row) {
      const destIdx = parseInt(row.dataset.row, 10);
      if (!isNaN(destIdx) && destIdx !== touchStartRowIdx) {
        reorderRows(state.brand, touchStartRowIdx, destIdx);
      }
    }
  }
  touchStartRowIdx = null;
}

// ==================== INCOGNITO & CROSS-DEVICE SYNC HELPERS ====================
function generateSyncHash() {
  try {
    const jsonStr = JSON.stringify(DB);
    const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonStr))));
    return location.origin + location.pathname + '#syncData=' + encoded;
  } catch(e) {
    return null;
  }
}

function checkUrlSyncData() {
  if (!location.hash || !location.hash.includes('#syncData=')) return false;
  try {
    const raw = location.hash.split('#syncData=')[1];
    if (!raw) return false;
    const jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(raw))));
    const parsed = JSON.parse(jsonStr);
    if (parsed && parsed.brands) {
      DB = cleanBuiltinData(parsed);
      Storage.set(DATA_KEY, JSON.stringify(DB), true);
      history.replaceState(null, '', location.pathname + location.search);
      return true;
    }
  } catch(e) {
    console.warn("Failed to import sync hash data:", e);
  }
  return false;
}

function reorderRows(brand, src, dest) {
  const b = DB.brands[brand];
  const item = b.rows.splice(src, 1)[0];
  b.rows.splice(dest, 0, item);

  const hasSections = b.rows.some(r=>r.section);
  if(hasSections){
    [Math.min(src,dest), Math.max(src,dest)].forEach(i=>{
      if(i > 0) b.rows[i].section = b.rows[i-1].section;
      else if(b.rows.length > 1) b.rows[i].section = b.rows[1].section;
    });
  }
  renderMain();
  scheduleSave();
}

function buildEditTable(brand){
  const b = DB.brands[brand];
  const fields = FIELDS[b.type];
  const hasSections = b.rows.some(r=>r.section);
  const topLevelCostKeys = new Set(fields.filter(f=>f.kind==='cost').map(f=>f.k));
  const needsOwnCost = f => f.kind==='price' && f.costKey && !topLevelCostKeys.has(f.costKey);
  const totalCols = 3 + fields.reduce((n,f)=> n + (f.kind==='cost'?1: (needsOwnCost(f)?2:1)), 0) + 1;

  let html = `<div class="toolbar">
    <div><h2>${brand}</h2><div class="hint">${b.rows.length} models · edit cost &amp; price, profit auto-calculates</div></div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="btn-add btn-danger no-print" id="clearticksbtn" style="background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.32);" title="Reset all verified tick marks">Clear All Ticks</button>
      <button class="btn-add no-print" id="sharesyncbtn" style="background: rgba(76,141,255,0.15); color: var(--blue); border: 1px solid rgba(76,141,255,0.32);" title="Copy instant sync link for Incognito or other windows">Sync Link</button>
      <button class="btn-add" id="addrowbtn">+ Add Model</button>
    </div>
  </div>
  <div class="col-legend"><span><span class="sw sw-cost"></span>Cost (what you pay)</span><span><span class="sw sw-price"></span>Price (what you charge)</span></div>`;
  html += `<div class="table-scroll"><table><thead><tr><th class="no-print" style="width:28px;"></th><th>Model</th><th style="width:100px;text-align:center;">Updated</th>`;
  fields.forEach(f=>{
    if(f.kind==='cost'){
      html += `<th>${f.label}</th>`;
    } else if(needsOwnCost(f)){
      html += `<th>${f.label} Cost</th><th>${f.label} Price</th><th>Profit</th>`;
    } else {
      html += `<th>${f.label}</th><th>Profit</th>`;
    }
  });
  html += `<th></th></tr></thead><tbody>`;

  let lastSection = null;
  b.rows.forEach((row, idx)=>{
    if(hasSections && row.section !== lastSection){
      lastSection = row.section;
      html += `<tr><td colspan="${totalCols}" class="section-row">${lastSection}</td></tr>`;
    }
    const ticked = row.ticked || false;
    const tickedAt = row.tickedAt || '';

    html += `<tr data-row="${idx}" data-model="${row.model.toLowerCase()}" class="draggable-row">`;
    html += `<td class="cell-drag no-print" style="text-align:center;"><span class="drag-handle" draggable="true" title="Drag handle to reorder model">⋮⋮</span></td>`;
    html += `<td class="cell-name"><input type="text" data-field="model" value="${escapeAttr(row.model)}"></td>`;
    html += `<td class="cell-tick">
      <input type="checkbox" data-tick="${idx}" ${ticked ? 'checked' : ''} title="Mark as checked/updated">
      <span class="cell-time" id="tick-time-${idx}">${tickedAt}</span>
    </td>`;
    fields.forEach(f=>{
      if(f.kind==='cost'){
        const val = row[f.k];
        html += `<td class="cell-cost"><span class="euro-prefix">€</span><input type="number" step="0.5" data-field="${f.k}" value="${val===null||val===undefined?'':val}" placeholder="—"></td>`;
      } else {
        const val = row[f.k];
        const costVal = f.costKey ? row[f.costKey] : null;
        if(needsOwnCost(f)){
          html += `<td class="cell-cost"><span class="euro-prefix">€</span><input type="number" step="0.5" data-field="${f.costKey}" value="${costVal===null||costVal===undefined?'':costVal}" placeholder="—"></td>`;
        }
        html += `<td class="cell-price"><span class="euro-prefix">€</span><input type="number" step="0.5" data-field="${f.k}" value="${val===null||val===undefined?'':val}" placeholder="—"></td>`;
        const p = calcProfit(val, costVal);
        html += `<td><span data-profit-for="${f.k}">${renderProfitChip(p)}</span></td>`;
      }
    });
    html += `<td class="cell-del">
      <button class="del-btn" data-moverow="${idx}" data-dir="-1" title="Move up">▲</button>
      <button class="del-btn" data-moverow="${idx}" data-dir="1" title="Move down">▼</button>
      <button class="del-btn" data-delrow="${idx}" title="Remove model">✕</button>
    </td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ==================== RENDER: CUSTOMER TABLE ====================
function buildCustomerTable(brand){
  const b = DB.brands[brand];
  const fields = FIELDS[b.type].filter(f=>f.kind==='price');
  const hasSections = b.rows.some(r=>r.section);

  let html = `<div class="cv-card"><div class="cv-head">
    <div><div class="cv-title">${brand}</div><div class="cv-sub">Repair Parts Price List</div></div>
    <div class="cv-badge">6-Month Warranty</div>
  </div>
  <div class="cv-table-scroll"><table><thead><tr><th style="text-align:left;">Model</th>`;
  fields.forEach(f=> html += `<th>${f.label}</th>`);
  html += `<th style="text-align:right; width:100px;">Last Edit</th></tr></thead><tbody>`;

  let lastSection = null;
  b.rows.forEach(row=>{
    const anyPrice = fields.some(f=> row[f.k] !== null && row[f.k] !== undefined && row[f.k] !== 0);
    if(!anyPrice) return;
    if(hasSections && row.section !== lastSection){
      lastSection = row.section;
      html += `<tr class="cv-sectiontitle"><td colspan="${fields.length+2}">${lastSection}</td></tr>`;
    }
    html += `<tr data-model="${row.model.toLowerCase()}"><td>${row.model}</td>`;
    fields.forEach(f=>{
      const val = row[f.k];
      const display = fmtEuro(val);
      html += `<td>${display ? `<span class="price-plain">${display}</span>` : `<span class="price-empty">—</span>`}</td>`;
    });
    const tickedAt = row.tickedAt || '—';
    html += `<td class="cell-time">${tickedAt}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div>
  <div class="cv-footer"><span>Retail Repair Price Matrix · Wholesale Parts</span><span>Updated live</span></div>
  </div>`;
  return html;
}

// ==================== RENDER: MAIN ====================
function renderMain(){
  const main = document.getElementById('main');
  if(state.mode === 'edit' && state.unlocked){
    main.innerHTML = buildEditTable(state.brand);
  } else {
    main.innerHTML = buildCustomerTable(state.brand);
  }
  applyPinned();
}
function applyPinned(){
  if(state.pinned.brand !== state.brand || !state.pinned.model) return;
  const row = document.querySelector(`tr[data-model="${CSS.escape(state.pinned.model)}"]`);
  if(row) row.classList.add('tr-pinned');
}

function moveRow(brand, idx, dir){
  const b = DB.brands[brand];
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= b.rows.length) return; // bounds check
  reorderRows(brand, idx, newIdx);
  const movedModel = b.rows[newIdx]?.model;
  if(movedModel){
    const row = document.querySelector(`tr[data-model="${CSS.escape(movedModel.toLowerCase())}"]`);
    if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

// ==================== EVENT DELEGATION: EDITING & ACTIONS ====================
document.getElementById('main').addEventListener('input', (e)=>{
  const input = e.target.closest('input[data-field]');
  if(!input) return;
  const tr = input.closest('tr[data-row]');
  if(!tr) return;
  const rowIdx = parseInt(tr.dataset.row, 10);
  const field = input.dataset.field;
  const b = DB.brands[state.brand];
  const row = b.rows[rowIdx];

  if(field === 'model'){
    row.model = input.value;
    tr.dataset.model = input.value.toLowerCase();
    ALL_ITEMS = flattenAll();
    scheduleSave();
    return;
  }

  const raw = input.value.trim();
  row[field] = raw === '' ? null : parseFloat(raw);

  const fields = FIELDS[b.type];
  fields.forEach(f=>{
    if(f.kind==='price' && (f.k===field || f.costKey===field)){
      const p = calcProfit(row[f.k], f.costKey ? row[f.costKey] : null);
      const cell = tr.querySelector(`[data-profit-for="${f.k}"]`);
      if(cell) cell.innerHTML = renderProfitChip(p);
    }
  });

  scheduleSave();
});

document.getElementById('main').addEventListener('change', (e)=>{
  const modelInput = e.target.closest('input[data-field="model"]');
  if(modelInput){
    const tr = modelInput.closest('tr[data-row]');
    if(!tr) return;
    const rowIdx = parseInt(tr.dataset.row, 10);
    const b = DB.brands[state.brand];

    b.rows[rowIdx].model = modelInput.value;

    ALL_ITEMS = flattenAll();
    scheduleSave();
    return;
  }

  const tickCheckbox = e.target.closest('input[data-tick]');
  if(tickCheckbox){
    const idx = parseInt(tickCheckbox.dataset.tick, 10);
    const b = DB.brands[state.brand];
    const row = b.rows[idx];
    row.ticked = tickCheckbox.checked;
    if(row.ticked){
      const now = new Date();
      const formatted = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ', ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      row.tickedAt = formatted;
      const timeSpan = document.getElementById(`tick-time-${idx}`);
      if(timeSpan) timeSpan.textContent = formatted;
    } else {
      row.tickedAt = null;
      const timeSpan = document.getElementById(`tick-time-${idx}`);
      if(timeSpan) timeSpan.textContent = '';
    }
    scheduleSave();
    return;
  }
});

document.getElementById('main').addEventListener('click', (e)=>{
  const moveBtn = e.target.closest('[data-moverow]');
  if(moveBtn){
    const idx = parseInt(moveBtn.dataset.moverow, 10);
    const dir = parseInt(moveBtn.dataset.dir, 10);
    moveRow(state.brand, idx, dir);
    return;
  }
  const delBtn = e.target.closest('[data-delrow]');
  if(delBtn){
    const idx = parseInt(delBtn.dataset.delrow, 10);
    const b = DB.brands[state.brand];
    const modelName = b.rows[idx].model;
    (async ()=>{
      const ok = await showModal({title:'Remove model?', message:`Remove "${modelName}" from ${state.brand}? This can't be undone.`, confirmText:'Remove', cancelText:'Cancel', danger:true});
      if(ok){
        b.rows.splice(idx,1);
        ALL_ITEMS = flattenAll();
        renderRail();
        renderMain();
        scheduleSave();
      }
    })();
    return;
  }
  const addBtn = e.target.closest('#addrowbtn');
  if(addBtn){
    (async ()=>{
      const code = await showModal({
        title: 'Add New Model',
        message: 'Enter the name of the new model:',
        showInput: true,
        placeholder: 'e.g. iPhone 16 Pro',
        confirmText: 'Add'
      });
      if(code){
        const b = DB.brands[state.brand];
        const defaultSection = b.rows.length ? b.rows[0].section : undefined;
        const newRow = newBlankRow(b.type, defaultSection);
        newRow.model = code;

        b.rows.unshift(newRow);

        ALL_ITEMS = flattenAll();
        renderRail();
        renderMain();
        scheduleSave();

        setTimeout(() => {
          const row = document.querySelector(`tr[data-model="${CSS.escape(code.toLowerCase())}"]`);
          if (row) {
            row.classList.add('flash');
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 60);
      }
    })();
    return;
  }
  const clearTicksBtn = e.target.closest('#clearticksbtn');
  if(clearTicksBtn){
    (async ()=>{
      const ok = await showModal({
        title: 'Clear all tick boxes?',
        message: 'This will reset all tick marks and last edit timestamps across ALL brands. This cannot be undone.',
        confirmText: 'Reset All',
        cancelText: 'Cancel',
        danger: true
      });
      if(ok){
        Object.keys(DB.brands).forEach(brand=>{
          DB.brands[brand].rows.forEach(row=>{
            row.ticked = false;
            row.tickedAt = null;
          });
        });
        renderMain();
        scheduleSave();
      }
    })();
    return;
  }
  const shareSyncBtn = e.target.closest('#sharesyncbtn');
  if(shareSyncBtn){
    (async ()=>{
      const syncUrl = generateSyncHash();
      if(syncUrl){
        try {
          await navigator.clipboard.writeText(syncUrl);
          await showAlert('Sync Link Copied!', 'The instant sync URL has been copied to your clipboard. Open this link in Incognito mode or any other device to load all current prices instantly!');
        } catch(err) {
          await showModal({
            title: 'Instant Sync URL',
            message: 'Copy and open this link in Incognito mode or another device to load prices instantly:',
            showInput: true,
            inputType: 'text',
            placeholder: syncUrl,
            confirmText: 'Done'
          });
        }
      }
    })();
    return;
  }
});

document.getElementById('adminbtn').onclick = async ()=>{

  await Storage.set(ADMIN_KEY,String(state.unlocked));

function applyAdminUI(){
  const mt = document.getElementById('modetoggle');
  const ss = document.getElementById('savestate');
  const ab = document.getElementById('adminbtn');
  if(state.unlocked){
    mt.classList.add('show');
    ss.classList.add('show');
    ab.classList.add('unlocked');
    ab.textContent = 'Close editor';
  } else {
    mt.classList.remove('show');
    ss.classList.remove('show');
    ab.classList.remove('unlocked');
    ab.textContent = 'Open editor';

}

// ==================== SEARCH ====================
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('searchresults');

function flattenAll(){
  const items = [];
  BRAND_ORDER.forEach(brand=>{
    const b = DB.brands[brand];
    if(!b) return;
    const fields = FIELDS[b.type].filter(f=>f.kind==='price');
    b.rows.forEach((row, idx)=>{
      const prices = fields
        .map(f=>({label:f.label, value: row[f.k]}))
        .filter(p=> p.value !== null && p.value !== undefined && p.value !== 0)
        .slice(0,3);
      items.push({brand, idx, model: row.model, prices});
    });
  });
  return items;
}

function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('show'); return; }
  const matches = ALL_ITEMS.filter(it=> it.model.toLowerCase().includes(q)).slice(0,30);
  if(matches.length===0){
    searchResults.innerHTML = `<div class="sr-empty">No models match "${q}"</div>`;
  } else {
    searchResults.innerHTML = matches.map((it,i)=>{
      const main = it.prices[0];
      const rest = it.prices.slice(1);
      const mainTag = main ? `<span class="sr-price-main">€${Number(main.value).toFixed(main.value%1===0?0:2)}</span>` : `<span class="sr-price-tag">no price set</span>`;
      const restTags = rest.map(p=>`<span class="sr-price-tag">${p.label} €${Number(p.value).toFixed(p.value%1===0?0:2)}</span>`).join('');
      return `
      <div class="sr-item" data-brand="${it.brand}" data-model="${it.model.toLowerCase()}">
        <div class="sr-left">
          <span class="sr-model">${it.model}</span>
          <span class="sr-brand">${it.brand}</span>
        </div>
        <div class="sr-prices">${restTags}${mainTag}</div>
      </div>`;
    }).join('');
  }
  searchResults.classList.add('show');
}
searchInput.addEventListener('input', ()=> doSearch(searchInput.value));
searchInput.addEventListener('focus', ()=>{ if(searchInput.value) doSearch(searchInput.value); });
searchInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const first = searchResults.querySelector('.sr-item');
    if(first){ first.click(); searchInput.blur(); }
  }
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#searchwrap')) searchResults.classList.remove('show');
});
searchResults.addEventListener('click', (e)=>{
  const item = e.target.closest('.sr-item');
  if(!item) return;
  const brand = item.dataset.brand;
  const model = item.dataset.model;
  state.brand = brand;
  state.pinned = {brand, model};
  renderRail();
  renderMain();
  searchResults.classList.remove('show');
  searchInput.value='';
  setTimeout(()=>{
    const row = document.querySelector(`tr[data-model="${CSS.escape(model)}"]`);
    if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
});

// ==================== TOAST & NETWORK MONITORING ====================
function showToast(msg, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
    document.body.appendChild(container);
  }
  const toast = document.createElement('div');
  const borderCol = type === 'success' ? 'var(--good)' : (type === 'error' ? 'var(--red)' : 'var(--blue)');
  toast.style.cssText = `background:var(--panel-solid);color:var(--text);border:1px solid ${borderCol};border-radius:8px;padding:9px 15px;font-size:12px;font-family:var(--font-body);box-shadow:0 10px 25px rgba(0,0,0,0.3);opacity:0;transform:translateY(10px);transition:all 0.2s ease;pointer-events:auto;display:flex;align-items:center;gap:8px;`;
  const icon = type === 'success' ? '✓' : (type === 'error' ? '✕' : 'ℹ');
  toast.innerHTML = `<span style="color:${borderCol};font-weight:bold;">${icon}</span> <span>${msg}</span>`;
  container.appendChild(toast);
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0)';
  });
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 250);
  }, 2800);
}


window.addEventListener('offline', () => {
  showToast('Working offline — changes saved locally', 'error');
});
